telemetry = false
logLevel = "debug" # "debug" | "warn" | "error"

[console]
depth = 2

[install]
auto = "auto"
exact = true
# Optional deps must stay enabled — @tailwindcss/cli pulls in @parcel/watcher,
# which require()s a platform-specific prebuilt at module load. With
# optional = false the release build crashes on Bun 1.3.14+ with "No prebuild
# or local build of @parcel/watcher found". Earlier Bun versions tolerated
# this through side channels (e.g. bunx's lazy resolver), but the supported
# fix is to keep optional dependencies enabled.
optional = true
# Only install package versions published at least 3 days ago
minimumReleaseAge = 259200
# These packages will bypass the 3-day minimum age requirement
# bun-types is @types/bun's transitive payload — excluding one without the
# other deadlocks installs whenever a fresh Bun ships.
minimumReleaseAgeExcludes = ["@types/bun", "bun-types", "typescript"]

[run]
# Scripts with a node shebang (eslint, tsc, prettier, commitlint) run under
# Node, not Bun. `bun = true` swaps node for Bun, and under Bun
# node:module isBuiltin('bun:test') is true, so obsidianmd/no-nodejs-modules
# flags every spec's `bun:test` import. The community catalog reviewer lints
# under Node, where it does not. Linting under Node keeps local findings equal
# to the reviewer's without switching the rule off for tests.
bun = false

[test]
coverage = false
onlyFailures = true
# Registers the `obsidian` runtime mock before any test module loads (the
# package is type-only, so value imports fail without it). See src/test-preload.ts.
preload = ["./src/test-preload.ts"]

[test.reporter]
dots = true

